# yaml-language-server: $schema=https://json.schemastore.org/github-workflow
#
# Treta-fork release workflow.
#
# Calls the existing build.yml with `publish: false` (so it skips Azure /
# Hostgator / codesign / notarization paths that require upstream-Mixxx
# secrets we don't carry on the VeltriaAI fork) and uploads the resulting
# artifacts to a GitHub Release on the current tag.
#
# Triggers on `v*-treta-*` tags or manual dispatch. Leaves upstream's
# release.yml untouched so we can keep merging upstream cleanly.
#
# Artifacts published (v1):
#   - Ubuntu 24.04 Qt6 DEB         (Linux x64; install.sh extracts via dpkg-deb -x)
#   - macOS Intel DMG              (Mac x64)
#   - macOS ARM DMG                (Mac arm64)
# Windows + Android are built by build.yml but not promoted to releases yet.

name: Release (Treta)

on:
  push:
    tags:
      - "v*-treta-*"
  workflow_dispatch:

permissions:
  contents: write   # required to create the release

jobs:
  build:
    uses: ./.github/workflows/build.yml
    with:
      publish: false
      branch: ${{ github.head_ref || github.ref_name }}
      ref: ${{ github.ref }}
    # No secrets passed — `publish: false` short-circuits every step that
    # needs them. If a step still references a secret, it'll be empty
    # and the conditional gate (`if: inputs.publish && …`) skips it.

  release:
    needs: build
    # Run even if some matrix entries failed — Flatpak / Android /
    # Windows-2022 are flaky and we don't ship them. As long as the
    # three artifacts we DO ship (Ubuntu DEB, macOS Intel DMG, macOS
    # ARM DMG) made it to actions/upload-artifact, the release goes out.
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v7
        with:
          path: artifacts
          # Don't fail if some artifacts are missing (a flaky job
          # might not have uploaded its bundle).
          merge-multiple: false

      - name: Rename DMGs by arch — they collide on basename
        # CPack on macOS produces `mixxx-<version>-macos.dmg` regardless
        # of arch, so the arm64 and x64 jobs upload identically-named
        # artifacts into different artifact directories. Without
        # renaming, softprops/action-gh-release sees two files with
        # the same destination name and the second overwrites the first.
        run: |
          set -eux
          mkdir -p out
          # Linux DEB — passed through as-is
          if compgen -G "artifacts/Ubuntu 24.04 Qt6 DEB/*.deb" >/dev/null; then
            cp artifacts/Ubuntu\ 24.04\ Qt6\ DEB/*.deb out/
          fi
          # macOS arm64 DMG → -macos-arm64.dmg
          if compgen -G "artifacts/macOS ARM DMG/*.dmg" >/dev/null; then
            for f in artifacts/macOS\ ARM\ DMG/*.dmg; do
              base=$(basename "$f" .dmg)
              cp "$f" "out/${base}-arm64.dmg"
            done
          fi
          # macOS x64 DMG → -macos-x64.dmg
          if compgen -G "artifacts/macOS Intel DMG/*.dmg" >/dev/null; then
            for f in artifacts/macOS\ Intel\ DMG/*.dmg; do
              base=$(basename "$f" .dmg)
              cp "$f" "out/${base}-x64.dmg"
            done
          fi
          ls -la out/

      - name: Create / update GitHub Release with artifacts
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: false
          files: |
            out/*.deb
            out/*.dmg
